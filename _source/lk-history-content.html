<!-- ================= ЛК: Счета — начало ================= -->
<div class="lk">
  <div class="lk-layout">

{{SIDEBAR}}

    <div class="lk-content">
      <h1 class="lk-pg-title">Счета</h1>
      <div class="lk-pg-sub">История документов расчёта · ИП Коваленко Наталья Ивановна, ИНН 745301234567</div>

      <!-- фильтры -->
      <div class="lk-filters lk-filters--period">
        <div class="lk-filter-field" id="lk-filter-contract-wrap">
          <label class="lk-form-lbl" for="lk-filter-contract">Договор</label>
          <select class="lk-select" id="lk-filter-contract"></select>
        </div>

        <div class="lk-filter-field">
          <span class="lk-form-lbl" id="lk-from-label">Период с</span>
          <div class="lk-period" role="group" aria-labelledby="lk-from-label">
            <select class="lk-select" id="lk-from-month" aria-label="Месяц начала периода"></select>
            <select class="lk-select" id="lk-from-year" aria-label="Год начала периода"></select>
          </div>
        </div>

        <div class="lk-filter-field">
          <span class="lk-form-lbl" id="lk-to-label">по</span>
          <div class="lk-period" role="group" aria-labelledby="lk-to-label">
            <select class="lk-select" id="lk-to-month" aria-label="Месяц конца периода"></select>
            <select class="lk-select" id="lk-to-year" aria-label="Год конца периода"></select>
          </div>
        </div>

        <div class="lk-filter-field">
          <button type="button" class="lk-filter-reset" id="lk-filter-reset" disabled>Сбросить</button>
        </div>
      </div>

      <!-- таблица документов -->
      <div class="lk-table-wrap">
        <table class="lk-table lk-table--cards lk-docs">
          <thead>
            <tr>
              <th scope="col">Договор</th>
              <th scope="col">Номер документа</th>
              <th scope="col">Дата документа</th>
              <th scope="col">Сумма</th>
              <th scope="col">Статус</th>
              <th scope="col">Счёт</th>
              <th scope="col">УПД</th>
              <th scope="col">Акт по объектам</th>
            </tr>
          </thead>
          <tbody id="lk-docs"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<!-- ================= ЛК: Счета — конец ================= -->
