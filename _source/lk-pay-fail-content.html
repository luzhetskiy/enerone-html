<!-- ================= ЛК: Проблемы с оплатой — начало ================= -->
<div class="lk">
  <div class="lk-layout">

{{SIDEBAR}}

    <div class="lk-content">
      <button type="button" class="lk-burger" data-lk-burger aria-label="Разделы кабинета">
        <span></span><span></span><span></span>
      </button>

      <div class="lk-result" data-pay-result="fail">
        <div class="lk-panel">

          <div class="lk-result-ico lk-result-ico--fail">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </div>

          <h1 class="lk-result-title">Возникли проблемы с оплатой</h1>
          <p class="lk-result-text" data-result-reason>
            Банк не подтвердил платёж.
          </p>

          <div class="lk-result-sum is-fail" data-result-total>—</div>

          <div class="lk-result-info">
            <div class="lk-result-row">
              <span class="lk-result-k">Договор</span>
              <span class="lk-result-v" data-result-contract>—</span>
            </div>
            <div class="lk-result-row">
              <span class="lk-result-k">Сумма платежа</span>
              <span class="lk-result-v" data-result-amount>—</span>
            </div>
            <div class="lk-result-row">
              <span class="lk-result-k">Комиссия банка</span>
              <span class="lk-result-v" data-result-fee>—</span>
            </div>
            <div class="lk-result-row">
              <span class="lk-result-k">Способ оплаты</span>
              <span class="lk-result-v" data-result-method>—</span>
            </div>
            <div class="lk-result-row">
              <span class="lk-result-k">Дата и время</span>
              <span class="lk-result-v" data-result-date>—</span>
            </div>
            <div class="lk-result-row">
              <span class="lk-result-k">Код ошибки</span>
              <span class="lk-result-v" data-result-code>—</span>
            </div>
          </div>

          <div class="lk-result-actions">
            <a class="lk-btn-primary" href="index.html">Вернуться в кабинет</a>
          </div>

          <p class="lk-result-help">
            Если оплата не проходит повторно —
            <a href="feedback.html?new=1&amp;topic=t-refund" data-support>напишите нам</a>,
            укажите код ошибки и время попытки.
          </p>

        </div>
      </div>

    </div>
  </div>
</div>
<!-- ================= ЛК: Проблемы с оплатой — конец ================= -->
