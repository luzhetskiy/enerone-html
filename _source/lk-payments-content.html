<!-- ================= ЛК: Платежи — начало ================= -->
<div class="lk">
  <div class="lk-layout">

{{SIDEBAR}}

    <div class="lk-content">
      <h1 class="lk-pg-title">Платежи</h1>
      <div class="lk-pg-sub">История платежей · ИП Коваленко Наталья Ивановна, ИНН 745301234567</div>

      <!-- фильтры -->
      <div class="lk-filters lk-filters--pay">
        <div class="lk-filter-field" id="lk-filter-contract-wrap">
          <label class="lk-form-lbl" for="lk-filter-contract">Договор</label>
          <select class="lk-select" id="lk-filter-contract"></select>
        </div>

        <div class="lk-filter-field">
          <label class="lk-form-lbl" for="lk-filter-from">Дата — начало</label>
          <input class="lk-input lk-date" id="lk-filter-from" type="date">
        </div>

        <div class="lk-filter-field">
          <label class="lk-form-lbl" for="lk-filter-to">Дата — конец</label>
          <input class="lk-input lk-date" id="lk-filter-to" type="date">
        </div>

        <div class="lk-filter-field">
          <span class="lk-form-lbl" id="lk-seg-label">Показывать</span>
          <div class="lk-seg" role="group" aria-labelledby="lk-seg-label">
            <button type="button" class="lk-seg-btn" data-only-ok="0" aria-pressed="false">Все</button>
            <button type="button" class="lk-seg-btn is-on" data-only-ok="1" aria-pressed="true">Только успешные</button>
          </div>
        </div>

        <div class="lk-filter-field">
          <button type="button" class="lk-filter-reset" id="lk-filter-reset" disabled>Сбросить</button>
        </div>
      </div>

      <!-- таблица платежей -->
      <div class="lk-table-wrap">
        <table class="lk-table lk-table--cards lk-pays">
          <thead>
            <tr>
              <th scope="col">Дата</th>
              <th scope="col">Договор</th>
              <th scope="col">Сумма без комиссии</th>
              <th scope="col">Комиссия</th>
              <th scope="col">Сумма с комиссией</th>
              <th scope="col">Тип платежа</th>
              <th scope="col">Статус</th>
            </tr>
          </thead>
          <tbody id="lk-pays"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<!-- ================= ЛК: Платежи — конец ================= -->
