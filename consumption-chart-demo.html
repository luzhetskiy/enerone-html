<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>График потребления — демо</title>

  <!-- 1. Ресурсы графика -->
  <link rel="stylesheet" href="consumption-chart.css">

  <!-- фон/отступы только для этой демо-страницы -->
  <style>
    body { background:#f2f4f7; margin:0; padding:32px 16px; font-family:'Golos Text',sans-serif; }
    .demo-wrap { max-width:760px; margin:0 auto; }
    .demo-h { font-size:13px; color:#8a97a3; margin:0 0 12px 4px; }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <p class="demo-h">Вариант 1 — программный вызов render()</p>
    <div id="chart"></div>

    <p class="demo-h" style="margin-top:32px;">Вариант 2 — авто-инициализация через data-атрибут</p>
    <div
      data-enerone-chart='[{"year":2026,"month":5,"value":"957.11"},{"year":2026,"month":4,"value":"889.68"},{"year":2026,"month":3,"value":"914.65"},{"year":2026,"month":2,"value":"829.88"},{"year":2026,"month":1,"value":"956.00"},{"year":2025,"month":12,"value":"924.00"},{"year":2025,"month":11,"value":"791.00"},{"year":2025,"month":10,"value":"2295.00"},{"year":2025,"month":9,"value":"845.20"},{"year":2025,"month":8,"value":"903.50"},{"year":2025,"month":7,"value":"878.30"},{"year":2025,"month":6,"value":"812.40"}]'
      data-title="Потребление счётчика ЦЭ2303-001845"
      data-unit="кВт·ч"></div>
  </div>

  <!-- 2. Скрипт графика -->
  <script src="consumption-chart.js"></script>

  <!-- 3. Ваши данные + вызов -->
  <script>
    var consumption = [
      {"year":2026,"month":5,"value":"957.11"},
      {"year":2026,"month":4,"value":"889.68"},
      {"year":2026,"month":3,"value":"914.65"},
      {"year":2026,"month":2,"value":"829.88"},
      {"year":2026,"month":1,"value":"956.00"},
      {"year":2025,"month":12,"value":"924.00"},
      {"year":2025,"month":11,"value":"791.00"},
      {"year":2025,"month":10,"value":"2295.00"},
      {"year":2025,"month":9,"value":"845.20"},
      {"year":2025,"month":8,"value":"903.50"},
      {"year":2025,"month":7,"value":"878.30"},
      {"year":2025,"month":6,"value":"812.40"}
    ];
    EneroneConsumptionChart.render('#chart', consumption, {
      title: 'Потребление электроэнергии',
      unit: 'кВт·ч'
    });
  </script>
</body>
</html>
